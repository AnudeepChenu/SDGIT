<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, I am Anudeep</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101014;
      color: #f7f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 8rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.06em;
    }

    h1 span {
      display: block;
      color: #a6ffcb;
    }

    p {
      margin-top: 1.25rem;
      color: #a7a7b4;
      font-size: clamp(1rem, 2vw, 1.25rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello,<span>I am Anudeep</span></h1>
    <p>Nice to meet you.</p>
  </main>
</body>
</html>
